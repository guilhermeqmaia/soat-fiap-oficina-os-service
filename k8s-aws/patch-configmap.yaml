# URLs publicas na topologia da Fase 3.
#
# `__GATEWAY_URL__` e substituido pelo CD (cd-aws.yml) com a var
# GATEWAY_URL = output `api_base_url` do stage `gateway/`
# (repo soat-fiap-oficina-infra-k8s). Sem ela o CD avisa e mantem o valor
# padrao — os links de aprovacao por e-mail so funcionam apontando para o
# gateway, que e o unico endereco publico da solucao.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-app-config
data:
  # Base dos links enviados nas notificacoes (webhooks de aprovacao da OS).
  PUBLIC_BASE_URL: "__GATEWAY_URL__"
  # Origens das SPAs + o proprio gateway (CORS).
  WEB_ORIGINS: "__GATEWAY_URL__,http://localhost:5173,http://localhost:5174"
  # RDS exige TLS (rds.force_ssl=1); o adapter pg cifra o canal (ver PrismaService).
  DB_SSL: "true"
  # Rate limiting e responsabilidade da borda (API Gateway: 400 rps / burst 800,
  # ADR-0005). Atras do VPC Link + NLB a app enxerga um unico IP de origem (ENI
  # do VPC Link) e o throttler por IP (100 req/60 s) viraria um limite GLOBAL
  # para todos os clientes — visto no teste de carga (4.684 x 429 em 5 min).
  THROTTLER_DISABLED: "true"
  # Notificacoes por webhook (US-F2-06/US-F3-11): receptor publico estavel
  # (echo, 200) que alimenta oficina_integracoes_total no painel de integracoes.
  # webhook.site gratuito limita (429) e virava "falha" em todas as entregas.
  # SMTP sem senha nao entrega nada em producao.
  NOTIFICATION_PROVIDER: "webhook"
  NOTIFICATION_WEBHOOK_URL: "https://postman-echo.com/post"
  # Emissor aceito nos tokens — a Lambda de CPF (US-F3-01/03).
  JWT_ISSUER: "oficina-auth-lambda"
  # APM (US-F3-10): o agente do Datadog roda no cluster (repo infra-k8s,
  # observability/). Fora do EKS estas vars nao existem e o tracing fica off.
  DD_TRACE_ENABLED: "true"
  DD_SERVICE: "oficina-mecanica-app"
  DD_ENV: "producao"
  # Comunicacao HTTP com a Execucao e o Billing (US-F4-18 / RFC-0008): mesmos
  # Services do namespace `oficina` no EKS — chamadas internas nao passam pelo gateway.
  EXECUCAO_SERVICE_URL: "http://execucao-service:3002"
  BILLING_SERVICE_URL: "http://billing-service:3001"
  # Ambiente de DEMONSTRACAO da Fase 4: habilita x-simular-falha para o video da compensacao
  # (US-F4-11). Remover em qualquer ambiente real.
  SAGA_SIMULAR_FALHA_HABILITADO: "true"
