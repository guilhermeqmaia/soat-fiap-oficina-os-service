<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, Helvetica Neue, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#262626"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#cf1322"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="960.0" y="46.0" font-size="32" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">Saga orquestrada no OS Service e tratamento de falhas</text>
<text x="960" y="92.0" font-size="19" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">O orquestrador guarda o estado em saga_os e, a cada passo, manda um comando HTTP ou espera um callback</text>
<rect x="40" y="135" width="208" height="108" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2"/>
<text x="144.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">ENFILEIRAR</text>
<text x="144.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">EXECUCAO</text>
<text x="144.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">comando → Execução</text>
<polyline points="248,189 274,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="274" y="135" width="208" height="108" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="378.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">AGUARDAR</text>
<text x="378.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">DIAGNOSTICO</text>
<text x="378.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">espera: mecânico</text>
<polyline points="482,189 508,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="508" y="135" width="208" height="108" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
<text x="612.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">GERAR</text>
<text x="612.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">ORCAMENTO</text>
<text x="612.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">comando → Billing</text>
<polyline points="716,189 742,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="742" y="135" width="208" height="108" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="846.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">AGUARDAR</text>
<text x="846.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">APROVACAO</text>
<text x="846.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">espera: cliente</text>
<polyline points="950,189 976,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="976" y="135" width="208" height="108" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2"/>
<text x="1080.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">INICIAR</text>
<text x="1080.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">EXECUCAO</text>
<text x="1080.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">comando → Execução</text>
<polyline points="1184,189 1210,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1210" y="135" width="208" height="108" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1314.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">AGUARDAR</text>
<text x="1314.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">FINALIZACAO</text>
<text x="1314.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">espera: mecânico</text>
<polyline points="1418,189 1444,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1444" y="135" width="208" height="108" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
<text x="1548.0" y="167.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">COBRAR</text>
<text x="1548.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">comando → Billing → MP</text>
<polyline points="1652,189 1678,189" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1678" y="135" width="208" height="108" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1782.0" y="156.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">AGUARDAR</text>
<text x="1782.0" y="178.0" font-size="17" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f">PAGAMENTO</text>
<text x="1782.0" y="219.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">espera: cliente</text>
<text x="1890" y="189.0" font-size="1" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#1f1f1f"></text>
<polyline points="1782,243 1782,266" fill="none" stroke="#262626" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1712.28" y="269" width="139.44" height="26" rx="5" fill="#ffffff" stroke="#389e0d"/>
<text x="1782" y="282.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#237804">saga CONCLUIDA</text>
<text x="40" y="282.0" font-size="15" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#595959">caixa cheia = comando automático · tracejada = espera por pessoa</text>
<rect x="40" y="315" width="600" height="555" rx="14" fill="#fff1f0" stroke="#cf1322" stroke-width="2"/>
<text x="340.0" y="351.0" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#cf1322">1 · Falha de negócio antes da execução</text>
<text x="68" y="401.0" font-size="18" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#434343">Quando:</text>
<text x="68" y="437.0" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">veículo já em execução · orçamento rejeitado</text>
<text x="68" y="471.0" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">prazo de aprovação vencido · cancelamento</text>
<text x="68" y="537.0" font-size="18" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#434343">Como a saga trata:</text>
<text x="68" y="581.0" font-size="21" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">saga entra em COMPENSANDO</text>
<text x="68" y="631.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">→ billing.cancelar-orcamento</text>
<text x="68" y="681.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">→ execucao.liberar-reservas</text>
<text x="68" y="731.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">   (devolve ao estoque as peças baixadas)</text>
<text x="68" y="781.0" font-size="21" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">OS CANCELADA com o motivo</text>
<rect x="660" y="315" width="600" height="555" rx="14" fill="#fff7e6" stroke="#d48806" stroke-width="2"/>
<text x="960.0" y="351.0" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#d48806">2 · Falha técnica (serviço fora, timeout, 5xx)</text>
<text x="688" y="401.0" font-size="18" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#434343">Quando:</text>
<text x="688" y="437.0" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">participante não responde ao comando</text>
<text x="688" y="537.0" font-size="18" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#434343">Como a saga trata:</text>
<text x="688" y="581.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">retry com backoff: 200 ms, 800 ms, 3 s</text>
<text x="688" y="631.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">esgotou → falha pendente, saga parada</text>
<text x="688" y="681.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">alerta &quot;saga de OS parada&quot; (Datadog)</text>
<text x="688" y="731.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">operador: POST /admin/sagas/{n}/reprocessar</text>
<text x="688" y="781.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">→ mesmo comando, de novo (idempotente)</text>
<rect x="1280" y="315" width="600" height="555" rx="14" fill="#e6f4ff" stroke="#1677ff" stroke-width="2"/>
<text x="1580.0" y="351.0" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1677ff">3 · Pagamento recusado ou em atraso</text>
<text x="1308" y="401.0" font-size="18" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#434343">Quando:</text>
<text x="1308" y="437.0" font-size="20" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">o serviço já foi executado</text>
<text x="1308" y="537.0" font-size="18" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#434343">Como a saga trata:</text>
<text x="1308" y="581.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">sem rollback: não se desfaz um conserto</text>
<text x="1308" y="631.0" font-size="21" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">OS retida em AGUARDANDO_PAGAMENTO</text>
<text x="1308" y="681.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">cliente paga de novo pelo mesmo link</text>
<text x="1308" y="731.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">reconciliação com o Mercado Pago</text>
<text x="1308" y="781.0" font-size="21" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#1f1f1f">a cada 15 min fecha webhooks perdidos</text>
<rect x="40" y="895" width="1840" height="150" rx="12" fill="#fafafa" stroke="#8c8c8c" stroke-width="2"/>
<text x="960" y="930.0" font-size="21" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#262626">Garantias em todos os casos</text>
<text x="960" y="972.5" font-size="19" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">idempotência: comandos pelo número da OS · callbacks pelo id do envelope · movimentações de estoque com id fixo</text>
<text x="960" y="997.5" font-size="19" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#434343">lock otimista com retry · estado da saga consultável em GET /ordens-servico/numero/{n}/saga</text>
</svg>