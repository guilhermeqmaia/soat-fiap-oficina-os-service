# SonarCloud — OS Service (US-F4-13, ADR-0011)
#
# Valores do SonarCloud (organizacao importada do GitHub, chave padrao <org>_<repo>).
# Os dois valores abaixo vem do SonarCloud (https://sonarcloud.io):
#   - sonar.organization: "Organization Key" em My Account > Organizations
#                         (ou na URL: sonarcloud.io/organizations/<SONAR_ORG>)
#   - sonar.projectKey:   "Project Key" em <projeto> > Administration > Update Key
#                         (o padrao do import pelo GitHub e <org>_<repo>)
# Troque SONAR_ORG / SONAR_PROJECT_KEY aqui E nos badges do README.md.
# Enquanto os placeholders estiverem aqui, o job "SonarCloud" do ci-cd.yml falha de
# proposito com uma mensagem dizendo o que falta (nao pula em silencio).
# O token vai no secret SONAR_TOKEN do repositorio, nunca neste arquivo.
sonar.organization=guilhermeqmaia
sonar.projectKey=guilhermeqmaia_soat-fiap-oficina-os-service
sonar.projectName=Oficina - OS Service
sonar.projectVersion=1.1.0

# ─── Codigo ───────────────────────────────────────────────────────────────────
# So src/ e codigo de producao. features/ (Cucumber), test/contracts, e2e/stubs,
# perf/, prisma/ (migrations + seed) e scripts/ ficam de fora por estarem fora
# de sonar.sources; as exclusoes abaixo repetem isso para o caso de alguem
# ampliar sonar.sources.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=\
  src/generated/**,\
  src/main.ts,\
  src/test/**,\
  **/*.spec.ts,\
  features/**,\
  e2e/**,\
  test/**,\
  prisma/**,\
  perf/**,\
  scripts/**,\
  dist/**,\
  coverage/**,\
  reports/**

# Fora da COBERTURA (mas analisados para bugs/code smells), espelhando o
# collectCoverageFrom do jest.unit.config.ts: wiring do Nest e a fabrica de
# tokens de dev/teste. Dominio, casos de uso, saga e adapters contam.
sonar.coverage.exclusions=\
  **/*.module.ts,\
  **/testing/**

# DTOs repetem decorators do Swagger/class-validator por definicao.
sonar.cpd.exclusions=**/dto/**

# ─── Cobertura ────────────────────────────────────────────────────────────────
# unit:        npm run test:unit:cov        -> coverage/unit/lcov.info
# integracao:  npm run test:integration:cov -> coverage/integration/lcov.info
#              (repositorios Prisma contra Postgres real, Testcontainers)
# O Sonar soma os dois relatorios por arquivo.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.sourceEncoding=UTF-8
