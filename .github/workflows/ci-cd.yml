name: CI/CD - Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Passo 1: Execução dos testes automatizados
  # ---------------------------------------------------------------------------
  automated-tests:
    name: "1️⃣ Execução dos Testes Automatizados"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:unit:cov

      # US-F4-15: contrato HTTP. Bloqueantes: lint do OpenAPI (recommended-strict),
      # arquivo publicado em dia com os controllers e testes de contrato
      # (provedor, consumidor e fixtures dos callbacks).
      - name: Lint OpenAPI (redocly)
        run: npm run contracts:lint

      - name: Check published OpenAPI is up to date
        run: npm run openapi:check

      - name: Run contract tests
        run: npm run test:contracts

      - name: Run integration tests (testcontainers/Postgres)
        # testcontainers sobe um Postgres efêmero via Docker (disponível no
        # runner ubuntu-latest). Exercita os repositórios Prisma contra um banco
        # real — cobre os fluxos que os testes unitários mockam. Com cobertura
        # (coverage/integration/lcov.info) para o SonarCloud somar à do unit.
        run: npm run test:integration:cov

      # US-F4-13: os dois lcov vão para o job do SonarCloud (sem rodar os testes de novo).
      - name: Publicar relatórios de cobertura (lcov)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: |
            coverage/unit/lcov.info
            coverage/integration/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Check coverage gate (80%)
        run: |
          COVERAGE=$(grep -oP '(?<=Lines.*?\s)\d+\.\d+' coverage/unit/lcov-report/index.html | head -1)
          echo "📊 Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below gate 80%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets gate 80%"

  # ---------------------------------------------------------------------------
  # Qualidade: SonarCloud com quality gate bloqueante (US-F4-13, ADR-0011)
  #
  # Reaproveita o lcov de unit + integração do passo 1 (não roda os testes de
  # novo). `sonar.qualitygate.wait=true` faz o scanner esperar o resultado do
  # gate e falhar o job se ele reprovar — é este check ("🔎 SonarCloud (quality
  # gate)") que entra como obrigatório na branch protection da main.
  # Sem o secret SONAR_TOKEN, ou com os placeholders do sonar-project.properties
  # ainda lá, o job FALHA com a instrução do que configurar (não pula).
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: "🔎 SonarCloud (quality gate)"
    runs-on: ubuntu-latest
    needs: automated-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # decoração do PR pelo SonarCloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # blame/"new code" do Sonar precisam do histórico

      - name: Baixar cobertura do passo 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-lcov
          path: coverage

      - name: Conferir configuração do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          falhou=0
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error title=SONAR_TOKEN ausente::Crie o secret SONAR_TOKEN em Settings > Secrets and variables > Actions (token gerado em sonarcloud.io > My Account > Security). Sem ele o quality gate não roda e o PR não pode ser aprovado."
            falhou=1
          fi
          if grep -qE '^sonar\.(organization|projectKey)=SONAR_(ORG|PROJECT_KEY)$' sonar-project.properties; then
            echo "::error file=sonar-project.properties,title=Placeholders do SonarCloud::Troque SONAR_ORG e SONAR_PROJECT_KEY pelos valores do projeto no SonarCloud (e nos badges do README.md)."
            falhou=1
          fi
          ls -l coverage/unit/lcov.info coverage/integration/lcov.info
          exit $falhou

      - name: Análise SonarCloud + quality gate (bloqueante)
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          # Sem SONAR_HOST_URL a action usa o SonarCloud (sonarcloud.io).
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------------------
  # BDD nível de serviço (US-F4-14): Cucumber com Nest em memória + Postgres
  # (Testcontainers) + stubs HTTP da Execução/Billing. Todo PR. ~2 min.
  # Node 22: o @cucumber/cucumber 13 não suporta Node 20.
  # ---------------------------------------------------------------------------
  bdd:
    name: "🥒 BDD (Cucumber — serviço)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cucumber (features/*.feature)
        run: npm run test:bdd

      - name: Publicar relatório HTML do Cucumber
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cucumber-os-service
          path: reports/cucumber/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # BDD ponta a ponta (US-F4-14 / FLUXO 3): sobe o docker-compose.fase4.yml
  # (os-service real + Postgres, Billing/Execução = stubs de e2e/stubs, Mailpit)
  # e roda features/e2e só por HTTP entre containers.
  #
  # Roda em TODO PR (e na main), não só com label/nightly: medido em 11/11/2026,
  # build das imagens SEM cache 58 s + up/healthchecks 19 s + 12 cenários 11 s +
  # down 5 s ≈ 1,5 min local (estimativa no runner, com npm ci e pull das imagens
  # base: 4–6 min). Corre em paralelo e termina antes do deploy em kind (passo 4),
  # então não alonga a pipeline — e é a única prova do ciclo entre containers.
  # Se passar de ~10 min, mover para label `e2e` + nightly.
  # ---------------------------------------------------------------------------
  bdd-e2e:
    name: "🥒 BDD ponta a ponta (docker-compose.fase4)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Subir o ambiente da Fase 4 (npm run e2e:up)
        run: npm run e2e:up

      - name: Cucumber ponta a ponta (features/e2e)
        run: npm run test:bdd:e2e

      - name: Logs do compose (em falha)
        if: failure()
        run: |
          mkdir -p reports
          docker compose -f docker-compose.fase4.yml ps -a
          docker compose -f docker-compose.fase4.yml logs --no-color > reports/e2e-compose.log 2>&1 || true

      - name: Publicar relatório HTML do Cucumber (e2e)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cucumber-e2e
          path: |
            reports/cucumber/
            reports/e2e-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Derrubar o ambiente (npm run e2e:down)
        if: always()
        run: npm run e2e:down

  # ---------------------------------------------------------------------------
  # Passo 2: Build da aplicação
  # ---------------------------------------------------------------------------
  build-application:
    name: "2️⃣ Build da Aplicação"
    runs-on: ubuntu-latest
    needs: automated-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build NestJS application
        run: npm run build

      # Overlay de EKS (US-F4-06): precisa buildar e expor o NodePort 30080 do
      # gateway multi-servico (ADR-0013). secret.yaml nao e versionado: usa o example.
      - name: Validar overlay k8s-aws (kustomize)
        run: |
          cp k8s/secret.yaml.example k8s/secret.yaml
          kubectl kustomize k8s-aws > /tmp/k8s-aws.yaml
          rm -f k8s/secret.yaml
          grep -q 'nodePort: 30080' /tmp/k8s-aws.yaml || { echo '::error::Service do OS Service sem nodePort 30080'; exit 1; }
          ! grep -q 'type: LoadBalancer' /tmp/k8s-aws.yaml || { echo '::error::overlay ainda cria LoadBalancer'; exit 1; }

  # ---------------------------------------------------------------------------
  # Passo 3: Build da imagem Docker
  # ---------------------------------------------------------------------------
  build-docker-image:
    name: "3️⃣ Build da Imagem Docker"
    runs-on: ubuntu-latest
    needs: build-application
    permissions:
      contents: read
      packages: write # publicar a imagem no GHCR
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --production

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Docker image built successfully"

      # Publica a imagem no GitHub Container Registry. Nao roda em pull_request
      # (o GITHUB_TOKEN de forks nao tem packages:write e nao queremos publicar
      # em PR). O deploy em kind reconstrói a imagem para evitar artifacts.
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push da imagem para o GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Imagem publicada no GHCR"

  # ---------------------------------------------------------------------------
  # Passo 4: Provisionamento (Terraform) + Deploy dos manifestos (kubectl -k)
  #
  # Substitui os antigos jobs que subiam um Postgres inline com convencoes
  # divergentes. Agora o cluster e o banco vem do IaC versionado (US-F2-06) e a
  # aplicacao dos manifestos Kustomize versionados (US-F2-05) — uma unica fonte
  # de verdade para o deploy.
  #
  # Fluxo: terraform apply 01 (cluster kind) -> load da imagem no cluster ->
  # terraform apply 02 (Postgres + Secret oficina-db) -> kubectl apply -k k8s/.
  # ---------------------------------------------------------------------------
  deploy-terraform-k8s:
    name: "4️⃣ Provisionamento (Terraform) + Deploy (k8s)"
    runs-on: ubuntu-latest
    needs: build-docker-image
    timeout-minutes: 25
    env:
      TF_IN_AUTOMATION: "true"
      KIND_CLUSTER: oficina-local
      APP_IMAGE: oficina-mecanica-app:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Install kind CLI
        # A versao DEVE casar com o kind embutido no provider tehcyx/kind (v0.11.0
        # empacota sigs.k8s.io/kind v0.31.0). Um CLI mais antigo falha no
        # `kind load` com "failed to detect containerd snapshotter".
        run: |
          curl -sSLo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          kind version

      # --- Stage 01: cluster kind via Terraform (US-F2-06) -------------------
      - name: Terraform apply — cluster (01-cluster)
        working-directory: infra/terraform/01-cluster
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var "kind_worker_count=1"
          echo "KUBECONFIG=$HOME/.kube/oficina-mecanica.config" >> "$GITHUB_ENV"

      - name: Sanity — cluster acessível
        run: kubectl cluster-info --context "kind-${KIND_CLUSTER}"

      # --- Constrói e carrega a imagem dentro do cluster ---------------------
      # Evita depender de artifacts do GitHub Actions; algumas contas free podem
      # bater quota de artifact storage e quebrar a pipeline apesar dos testes
      # terem passado.
      - name: Build and load app image into kind
        run: |
          docker build -t "${APP_IMAGE}" .
          kind load docker-image "${APP_IMAGE}" --name "${KIND_CLUSTER}"

      # --- Stage 02: Postgres + Secret oficina-db via Terraform (US-F2-06) ---
      - name: Terraform apply — banco + secret (02-app)
        working-directory: infra/terraform/02-app
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

      # --- Secret da aplicação (oficina-app) para o Kustomize agregar --------
      # Contrato single-writer-per-Secret: oficina-db vem do Terraform (acima);
      # oficina-app é o dono do Kustomize. Aqui geramos valores de CI.
      - name: Gerar k8s/secret.yaml (oficina-app) para o CI
        run: |
          cat > k8s/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: oficina-app
          type: Opaque
          stringData:
            JWT_SECRET: "$(openssl rand -base64 48)"
            NOTIFICATION_WEBHOOK_SECRET: "ci-notification-secret"
          EOF

      # --- Deploy da aplicação pelos manifestos versionados (US-F2-05) -------
      - name: kubectl apply -k k8s/
        run: kubectl apply -k k8s/

      - name: Aguardar migrations e rollout da aplicação
        run: |
          kubectl wait --for=condition=complete job/oficina-migrations -n oficina --timeout=180s \
            || kubectl logs job/oficina-migrations -n oficina --all-containers=true || true
          kubectl rollout status deployment/oficina-app -n oficina --timeout=240s

      - name: Smoke test — /health e /health/ready
        run: |
          POD=$(kubectl get pod -n oficina \
            -l app.kubernetes.io/name=oficina-app,app.kubernetes.io/component=api \
            -o jsonpath='{.items[0].metadata.name}')
          echo "🔎 Pod: $POD"
          echo "→ /health (liveness)"
          kubectl exec -n oficina "$POD" -- wget -qO- http://localhost:3000/health
          echo
          echo "→ /health/ready (readiness, checa o banco)"
          kubectl exec -n oficina "$POD" -- wget -qO- http://localhost:3000/health/ready
          echo

      - name: Verificar recursos no cluster
        if: always()
        run: |
          echo "📦 Recursos no namespace oficina:"
          kubectl get deploy,pods,svc,hpa,jobs,secret -n oficina || true

  # ---------------------------------------------------------------------------
  # Resumo: Pipeline Status
  # ---------------------------------------------------------------------------
  pipeline-summary:
    name: "✅ Resumo da Pipeline CI/CD"
    runs-on: ubuntu-latest
    needs:
      [
        automated-tests,
        sonarcloud,
        bdd,
        bdd-e2e,
        build-application,
        build-docker-image,
        deploy-terraform-k8s,
      ]
    if: always()
    steps:
      - name: Display CI/CD Pipeline Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║          CI/CD Pipeline - Resumo                              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "1️⃣  Execução dos Testes Automatizados: ${{ needs.automated-tests.result }}"
          echo "🔎 SonarCloud (quality gate): ${{ needs.sonarcloud.result }}"
          echo "🥒 BDD (serviço): ${{ needs.bdd.result }}"
          echo "🥒 BDD ponta a ponta: ${{ needs.bdd-e2e.result }}"
          echo "2️⃣  Build da Aplicação: ${{ needs.build-application.result }}"
          echo "3️⃣  Build da Imagem Docker: ${{ needs.build-docker-image.result }}"
          echo "4️⃣  Provisionamento (Terraform) + Deploy (k8s): ${{ needs.deploy-terraform-k8s.result }}"
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo ""

          if [ "${{ needs.automated-tests.result }}" = "failure" ] || \
             [ "${{ needs.sonarcloud.result }}" = "failure" ] || \
             [ "${{ needs.bdd.result }}" = "failure" ] || \
             [ "${{ needs.bdd-e2e.result }}" = "failure" ] || \
             [ "${{ needs.build-application.result }}" = "failure" ] || \
             [ "${{ needs.build-docker-image.result }}" = "failure" ] || \
             [ "${{ needs.deploy-terraform-k8s.result }}" = "failure" ]; then
            echo "❌ Pipeline FALHOU em um ou mais passos"
            echo "╚════════════════════════════════════════════════════════════════╝"
            exit 1
          fi

          echo "✅ Todos os passos da CI/CD executaram com sucesso!"
          echo "╚════════════════════════════════════════════════════════════════╝"
