services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina_mecanica_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d oficina_mecanica']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: oficina_mecanica_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oficina_mecanica?schema=public
      PORT: '${PORT:-3000}'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required — set it in .env or your shell env}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-1h}'
      # Testes de carga (US-F2-11): subir com THROTTLER_DISABLED=true para o k6
      # medir a app, nao o rate limiter. Vazio por padrao = throttler ativo.
      THROTTLER_DISABLED: '${THROTTLER_DISABLED:-}'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-http://localhost:3000}'
      # Comunicacao HTTP com a Execucao e o Billing (Fase 4, US-F4-18 / RFC-0008).
      # Rodando os outros servicos na maquina (fora do compose), o container os
      # alcanca por host.docker.internal; no cluster, pelo DNS interno (ConfigMap).
      EXECUCAO_SERVICE_URL: '${EXECUCAO_SERVICE_URL:-http://host.docker.internal:3002}'
      BILLING_SERVICE_URL: '${BILLING_SERVICE_URL:-http://host.docker.internal:3001}'
      WEB_ORIGINS: '${WEB_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    entrypoint: ['sh', '-c', 'npx prisma migrate deploy && exec node dist/main.js']

  web-admin:
    build:
      context: ./web/admin
      args:
        VITE_API_URL: '${VITE_API_URL:-http://localhost:3000}'
    container_name: oficina_mecanica_web_admin
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      app:
        condition: service_healthy

  web-cliente:
    build:
      context: ./web/cliente
      args:
        VITE_API_URL: '${VITE_API_URL:-http://localhost:3000}'
    container_name: oficina_mecanica_web_cliente
    restart: unless-stopped
    ports:
      - '8081:8080'
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
